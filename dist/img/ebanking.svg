  <title id="title">E-Banking service flow</title><desc id="desc">A React dashboard sends a JWT through Spring Cloud Gateway and Eureka to banking services with service-owned data.</desc>
  <rect width="720" height="360" fill="#1d3031"/><text x="43" y="47" fill="#b9d6cf" font-family="monospace" font-size="13">e-banking / authenticated account request</text>
  <g fill="none" stroke="#649090" stroke-width="1.5"><path d="M174 180H220M366 180H412M558 180H600"/><rect x="44" y="140" width="130" height="80" rx="6"/><rect x="220" y="140" width="146" height="80" rx="6"/><rect x="412" y="140" width="146" height="80" rx="6"/><rect x="600" y="140" width="76" height="80" rx="6"/></g>
  <g font-family="monospace" text-anchor="middle" fill="#e2f6f0"><text x="109" y="177" font-size="15">React</text><text x="109" y="198" font-size="11" fill="#b9d6cf">Bearer JWT</text><text x="293" y="177" font-size="15">Gateway</text><text x="293" y="198" font-size="11" fill="#b9d6cf">identity</text><text x="485" y="177" font-size="15">Eureka</text><text x="485" y="198" font-size="11" fill="#b9d6cf">route</text><text x="638" y="177" font-size="15">H2</text><text x="638" y="198" font-size="11" fill="#b9d6cf">data</text><text x="360" y="298" font-size="12" fill="#b9d6cf">JWT → gateway → discovery → banking service</text></g>
