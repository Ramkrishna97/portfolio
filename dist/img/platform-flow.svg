      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.03;0.045;0.185;0.2;1" dur="12s" repeatCount="indefinite"/>
    </circle><circle class="motion" r="4.5" fill="var(--accent)" opacity="0">
      <animateMotion path="M260 164H190H260" keyPoints="0;0;1;1" keyTimes="0;0.28;0.45;1" calcMode="linear" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.28;0.295;0.435;0.45;1" dur="12s" repeatCount="indefinite"/>
    </circle><circle class="motion" r="4.5" fill="var(--accent)" opacity="0">
      <animateMotion path="M360 196V230H273V270" keyPoints="0;0;1;1" keyTimes="0;0.53;0.7;1" calcMode="linear" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.53;0.545;0.685;0.7;1" dur="12s" repeatCount="indefinite"/>
    </circle><circle class="motion" r="4.5" fill="var(--accent)" opacity="0">
      <animateMotion path="M273 270V230H360V93" keyPoints="0;0;1;1" keyTimes="0;0.78;0.95;1" calcMode="linear" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.78;0.795;0.935;0.95;1" dur="12s" repeatCount="indefinite"/>
