<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">all-in-one / example: catalog request</title>
  <desc id="desc">A browser request reaches the API gateway. Eureka supplies service discovery, the gateway routes to the catalog service, and the response returns through the gateway. Auth, Orders and Classroom are independent routes.</desc>
  <style>
    svg { --node:#303f51; --line:#728ba6; --accent:#a4d8f2; --text:#e0ebf7; --muted:#bacbdd; background:#242b3a; font-family:monospace; }
    text { fill:var(--text); }
    .node-title { text-anchor:middle; font-size:17px; }
    .node-subtitle { text-anchor:middle; font-size:11px; fill:var(--muted); }
    .wire { fill:none; stroke:var(--line); stroke-width:1.5; }
    .motion { visibility:hidden; }
    .motion-ready .motion { visibility:visible; }
    .motion-ready .overview { visibility:hidden; }
    .phase-caption { text-anchor:middle; font-size:16px; fill:var(--accent); }
    @media (prefers-reduced-motion:reduce) { .motion-ready .motion { visibility:hidden !important; } .motion-ready .overview { visibility:visible !important; } }
  </style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#728ba6"/></marker></defs>
  <rect width="720" height="420" fill="#242b3a"/>
  <text x="24" y="29" style="fill:var(--muted);font-size:13px">all-in-one / example: catalog request</text>
