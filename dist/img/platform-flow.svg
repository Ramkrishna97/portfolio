="7" fill="var(--node)" stroke="var(--line)"/><rect class="motion" x="200" y="270" width="146" height="68" rx="7" fill="none" stroke="var(--accent)" stroke-width="2.5" opacity="0"><animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;.25;.5;.75;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></rect><text x="273.0" y="300.0" class="node-title">Catalog</text><text x="273.0" y="321.0" class="node-subtitle">product listings</text><rect x="372" y="270" width="146" height="68" rx="7" fill="var(--node)" stroke="var(--line)"/><text x="445.0" y="300.0" class="node-title">Orders</text><text x="445.0" y="321.0" class="node-subtitle">cart / checkout</text><rect x="544" y="270" width="148" height="68" rx="7" fill="var(--node)" stroke="var(--line)"/><text x="618.0" y="300.0" class="node-title">Classroom</text><text x="618.0" y="321.0" class="node-subtitle">learning content</text><circle class="motion" r="4.5" fill="var(--accent)" opacity="0">
