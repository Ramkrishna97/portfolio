  <path d="M24 362H696" stroke="#728ba6" opacity=".45"/>
  <text class="overview" x="360" y="394" style="text-anchor:middle;fill:var(--muted);font-size:13px">Browser → gateway → chosen service → response</text>
  <text class="motion phase-caption" x="360" y="394" opacity="0" aria-hidden="true">1 / The browser sends a request to the gateway<animate attributeName="opacity" values="1;0;0;0;1" keyTimes="0;.25;.5;.75;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text><text class="motion phase-caption" x="360" y="394" opacity="0" aria-hidden="true">2 / Resolve the destination using Eureka<animate attributeName="opacity" values="0;1;0;0;0" keyTimes="0;.25;.5;.75;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text><text class="motion phase-caption" x="360" y="394" opacity="0" aria-hidden="true">3 / Route this request to the Catalog service<animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;.25;.5;.75;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text><text class="motion phase-caption" x="360" y="394" opacity="0" aria-hidden="true">4 / Return the response through the gateway<animate attributeName="opacity" values="0;0;0;1;0" keyTimes="0;.25;.5;.75;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
</svg>