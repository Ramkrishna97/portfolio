  <g font-family="monospace" text-anchor="middle" fill="#f1ecff"><text x="99" y="177" font-size="15">Teacher</text><text x="99" y="198" font-size="11" fill="#c8c0df">publish</text><text x="279" y="177" font-size="15">React UI</text><text x="279" y="198" font-size="11" fill="#c8c0df">feed / quiz</text><text x="474" y="177" font-size="15">Spring API</text><text x="474" y="198" font-size="11" fill="#c8c0df">roles / modules</text><text x="644" y="177" font-size="15">H2</text><text x="644" y="198" font-size="11" fill="#c8c0df">results</text><text x="360" y="298" font-size="12" fill="#c8c0df">Publish → authorize → attempt → score</text></g>
