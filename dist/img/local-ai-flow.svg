<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">local-ai-helper / example: screen assistance</title>
  <desc id="desc">A local GGUF model loads in llama.cpp. MediaProjection captures a screen frame, ML Kit extracts visible text, llama.cpp processes it, and tokens stream to the Screen conversation. Chat keeps its own separate context.</desc>
