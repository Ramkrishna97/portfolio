  <text class="overview" x="360" y="394" style="text-anchor:middle;fill:var(--muted);font-size:13px">GGUF + screen text → local inference → Screen reply</text>
  <text class="motion phase-caption" x="360" y="394" opacity="0" aria-hidden="true">1 / Load a local GGUF model into llama.cpp<animate attributeName="opacity" values="1;0;0;0;1" keyTimes="0;.25;.5;.75;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text><text class="motion phase-caption" x="360" y="394" opacity="0" aria-hidden="true">2 / Capture screen text with MediaProjection + OCR<animate attributeName="opacity" values="0;1;0;0;0" keyTimes="0;.25;.5;.75;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text><text class="motion phase-caption" x="360" y="394" opacity="0" aria-hidden="true">3 / Process the text locally with llama.cpp<animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;.25;.5;.75;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text><text class="motion phase-caption" x="360" y="394" opacity="0" aria-hidden="true">4 / Stream tokens to the Screen conversation<animate attributeName="opacity" values="0;0;0;1;0" keyTimes="0;.25;.5;.75;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
