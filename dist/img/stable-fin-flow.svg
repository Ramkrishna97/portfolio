<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">stable-fin / retirement projection</title>
  <desc id="desc">A retirement form supplies savings, contribution, return, expense, and inflation assumptions. The service compounds contributions monthly, inflates future expenses, simulates monthly retirement withdrawals, and returns a sustainability result.</desc>
  <style>
    svg { --node:#4a4032; --line:#9f8b6f; --accent:#f2c879; --text:#fff1d7; --muted:#d8c6a6; background:#302b26; font-family:monospace; }
    text { fill:var(--text); }.node-title { text-anchor:middle; font-size:17px; }.node-subtitle { text-anchor:middle; font-size:11px; fill:var(--muted); }.wire { fill:none; stroke:var(--line); stroke-width:1.5; }.motion { visibility:hidden; }.motion-ready .motion { visibility:visible; }.motion-ready .overview { visibility:hidden; }.phase-caption { text-anchor:middle; font-size:16px; fill:var(--accent); }
    @media (prefers-reduced-motion:reduce) { .motion-ready .motion { visibility:hidden !important; } .motion-ready .overview { visibility:visible !important; } }
  </style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#9f8b6f"/></marker></defs>
  <rect width="720" height="420" fill="#302b26"/><text x="24" y="29" style="fill:var(--muted);font-size:13px">stable-fin / retirement projection</text>
  <path d="M166 185H205" class="wire" marker-end="url(#arrow)"/><path d="M345 185H384" class="wire" marker-end="url(#arrow)"/><path d="M524 185H563" class="wire" marker-end="url(#arrow)"/>
  <rect x="24" y="137" width="142" height="96" rx="7" fill="var(--node)" stroke="var(--line)"/><rect class="motion" x="24" y="137" width="142" height="96" rx="7" fill="none" stroke="var(--accent)" stroke-width="2.5" opacity="0"><animate attributeName="opacity" values="1;0;0;0;1" keyTimes="0;.25;.5;.75;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></rect><text x="95" y="177" class="node-title">Plan inputs</text><text x="95" y="198" class="node-subtitle">savings / rates</text><text x="95" y="216" class="node-subtitle">expense / years</text>
  <rect x="205" y="137" width="140" height="96" rx="7" fill="var(--node)" stroke="var(--line)"/><rect class="motion" x="205" y="137" width="140" height="96" rx="7" fill="none" stroke="var(--accent)" stroke-width="2.5" opacity="0"><animate attributeName="opacity" values="0;1;0;0;0" keyTimes="0;.25;.5;.75;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></rect><text x="275" y="177" class="node-title">Grow corpus</text><text x="275" y="198" class="node-subtitle">monthly compound</text><text x="275" y="216" class="node-subtitle">2-year step-up</text>
  <rect x="384" y="137" width="140" height="96" rx="7" fill="var(--node)" stroke="var(--line)"/><rect class="motion" x="384" y="137" width="140" height="96" rx="7" fill="none" stroke="var(--accent)" stroke-width="2.5" opacity="0"><animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;.25;.5;.75;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></rect><text x="454" y="177" class="node-title">Retirement sim</text><text x="454" y="198" class="node-subtitle">inflated expense</text><text x="454" y="216" class="node-subtitle">monthly drawdown</text>
  <rect x="563" y="137" width="133" height="96" rx="7" fill="var(--node)" stroke="var(--line)"/><rect class="motion" x="563" y="137" width="133" height="96" rx="7" fill="none" stroke="var(--accent)" stroke-width="2.5" opacity="0"><animate attributeName="opacity" values="0;0;0;1;0" keyTimes="0;.25;.5;.75;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></rect><text x="629.5" y="177" class="node-title">Result</text><text x="629.5" y="198" class="node-subtitle">survives / depletes</text><text x="629.5" y="216" class="node-subtitle">ending balance</text>
  <text x="275" y="275" class="node-subtitle">principal + returns</text><text x="454" y="275" class="node-subtitle">interest − expense</text>
  <circle class="motion" r="4.5" fill="var(--accent)" opacity="0"><animateMotion path="M166 185H205" keyPoints="0;0;1;1" keyTimes="0;0.03;0.2;1" calcMode="linear" dur="12s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.03;0.045;0.185;0.2;1" dur="12s" repeatCount="indefinite"/></circle>
  <circle class="motion" r="4.5" fill="var(--accent)" opacity="0"><animateMotion path="M345 185H384" keyPoints="0;0;1;1" keyTimes="0;0.28;0.45;1" calcMode="linear" dur="12s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.28;0.295;0.435;0.45;1" dur="12s" repeatCount="indefinite"/></circle>
  <circle class="motion" r="4.5" fill="var(--accent)" opacity="0"><animateMotion path="M384 185H524" keyPoints="0;0;1;1" keyTimes="0;0.53;0.7;1" calcMode="linear" dur="12s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.53;0.545;0.685;0.7;1" dur="12s" repeatCount="indefinite"/></circle>
  <circle class="motion" r="4.5" fill="var(--accent)" opacity="0"><animateMotion path="M524 185H563" keyPoints="0;0;1;1" keyTimes="0;0.78;0.95;1" calcMode="linear" dur="12s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.78;0.795;0.935;0.95;1" dur="12s" repeatCount="indefinite"/></circle>
  <path d="M24 362H696" stroke="#9f8b6f" opacity=".45"/><text class="overview" x="360" y="394" style="text-anchor:middle;fill:var(--muted);font-size:13px">Inputs → compound corpus → simulate drawdown → verdict</text>
  <text class="motion phase-caption" x="360" y="394" opacity="0" aria-hidden="true">1 / Collect savings, contribution, rate, and expense inputs<animate attributeName="opacity" values="1;0;0;0;1" keyTimes="0;.25;.5;.75;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
  <text class="motion phase-caption" x="360" y="394" opacity="0" aria-hidden="true">2 / Compound monthly contributions until retirement<animate attributeName="opacity" values="0;1;0;0;0" keyTimes="0;.25;.5;.75;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
  <text class="motion phase-caption" x="360" y="394" opacity="0" aria-hidden="true">3 / Inflate expenses and simulate each retirement month<animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;.25;.5;.75;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
  <text class="motion phase-caption" x="360" y="394" opacity="0" aria-hidden="true">4 / Report sustainability, duration, and ending balance<animate attributeName="opacity" values="0;0;0;1;0" keyTimes="0;.25;.5;.75;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
</svg>
