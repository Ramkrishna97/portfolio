<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">spring-log / method logging</title>
  <desc id="desc">A Spring bean call crosses an AOP proxy, executes the method, returns its result or exception, and logs through SLF4J. Simplified method logging flow.</desc>
  <style>
    svg { --node:#2b4540; --line:#6d9688; --accent:#86e6cf; --text:#e0efe9; --muted:#b6cec5; background:#1b302e; font-family:monospace; }
    text { fill:var(--text); }
    .node-title { text-anchor:middle; font-size:17px; }
    .node-subtitle { text-anchor:middle; font-size:11px; fill:var(--muted); }
    .wire { fill:none; stroke:var(--line); stroke-width:1.5; }
    .motion { visibility:hidden; }
    .motion-ready .motion { visibility:visible; }
    .motion-ready .overview { visibility:hidden; }
    .phase-caption { text-anchor:middle; font-size:16px; fill:var(--accent); }
    @media (prefers-reduced-motion:reduce) { .motion-ready .motion { visibility:hidden !important; } .motion-ready .overview { visibility:visible !important; } }
  </style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#6d9688"/></marker></defs>
  <rect width="720" height="420" fill="#1b302e"/>
  <text x="24" y="29" style="fill:var(--muted);font-size:13px">spring-log / method logging</text>
  <path d="M168 169H244" class="wire" marker-end="url(#arrow)"/><path d="M414 158H500" class="wire" marker-end="url(#arrow)"/><path d="M500 183H414" class="wire" marker-end="url(#arrow)"/><path d="M329 206V268" class="wire" marker-end="url(#arrow)"/><rect x="24" y="132" width="144" height="74" rx="7" fill="var(--node)" stroke="var(--line)"/><text x="96.0" y="165.0" class="node-title">App call</text><text x="96.0" y="186.0" class="node-subtitle">method invocation</text><rect x="244" y="132" width="170" height="74" rx="7" fill="var(--node)" stroke="var(--line)"/><rect class="motion" x="244" y="132" width="170" height="74" rx="7" fill="none" stroke="var(--accent)" stroke-width="2.5" opacity="0"><animate attributeName="opacity" values="1;0;0;0;1" keyTimes="0;.25;.5;.75;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></rect><text x="329.0" y="165.0" class="node-title">Spring AOP</text><text x="329.0" y="186.0" class="node-subtitle">intercepts call</text><rect x="500" y="132" width="190" height="74" rx="7" fill="var(--node)" stroke="var(--line)"/><rect class="motion" x="500" y="132" width="190" height="74" rx="7" fill="none" stroke="var(--accent)" stroke-width="2.5" opacity="0"><animate attributeName="opacity" values="0;1;0;0;0" keyTimes="0;.25;.5;.75;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></rect><text x="595.0" y="165.0" class="node-title">Spring bean</text><text x="595.0" y="186.0" class="node-subtitle">runs method</text><rect x="244" y="268" width="170" height="64" rx="7" fill="var(--node)" stroke="var(--line)"/><rect class="motion" x="244" y="268" width="170" height="64" rx="7" fill="none" stroke="var(--accent)" stroke-width="2.5" opacity="0"><animate attributeName="opacity" values="0;0;0;1;0" keyTimes="0;.25;.5;.75;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></rect><text x="329.0" y="296.0" class="node-title">SLF4J</text><text x="329.0" y="317.0" class="node-subtitle">application logger</text><text x="457" y="143" class="node-subtitle">call</text><text x="457" y="211" class="node-subtitle">return</text><text x="442" y="296" style="fill:var(--muted);font-size:12px">start / result / error logs</text><circle class="motion" r="4.5" fill="var(--accent)" opacity="0">
      <animateMotion path="M168 169H244" keyPoints="0;0;1;1" keyTimes="0;0.03;0.2;1" calcMode="linear" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.03;0.045;0.185;0.2;1" dur="12s" repeatCount="indefinite"/>
    </circle><circle class="motion" r="4.5" fill="var(--accent)" opacity="0">
      <animateMotion path="M414 158H500" keyPoints="0;0;1;1" keyTimes="0;0.28;0.45;1" calcMode="linear" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.28;0.295;0.435;0.45;1" dur="12s" repeatCount="indefinite"/>
    </circle><circle class="motion" r="4.5" fill="var(--accent)" opacity="0">
      <animateMotion path="M500 183H414" keyPoints="0;0;1;1" keyTimes="0;0.53;0.7;1" calcMode="linear" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.53;0.545;0.685;0.7;1" dur="12s" repeatCount="indefinite"/>
    </circle><circle class="motion" r="4.5" fill="var(--accent)" opacity="0">
      <animateMotion path="M329 206V268" keyPoints="0;0;1;1" keyTimes="0;0.78;0.95;1" calcMode="linear" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.78;0.795;0.935;0.95;1" dur="12s" repeatCount="indefinite"/>
    </circle>
  <path d="M24 362H696" stroke="#6d9688" opacity=".45"/>
  <text class="overview" x="360" y="394" style="text-anchor:middle;fill:var(--muted);font-size:13px">Call → AOP proxy → Spring bean → SLF4J</text>
  <text class="motion phase-caption" x="360" y="394" opacity="0" aria-hidden="true">1 / A method call enters the AOP proxy<animate attributeName="opacity" values="1;0;0;0;1" keyTimes="0;.25;.5;.75;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text><text class="motion phase-caption" x="360" y="394" opacity="0" aria-hidden="true">2 / The proxy invokes the Spring bean<animate attributeName="opacity" values="0;1;0;0;0" keyTimes="0;.25;.5;.75;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text><text class="motion phase-caption" x="360" y="394" opacity="0" aria-hidden="true">3 / The method returns a result or exception<animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;.25;.5;.75;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text><text class="motion phase-caption" x="360" y="394" opacity="0" aria-hidden="true">4 / Execution details are logged through SLF4J<animate attributeName="opacity" values="0;0;0;1;0" keyTimes="0;.25;.5;.75;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
</svg>