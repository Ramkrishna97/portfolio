<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">Stable-Fin retirement projection</title><desc id="desc">Financial assumptions flow through monthly corpus growth and retirement drawdown simulation to a sustainability result.</desc>
  <rect width="720" height="360" fill="#302b26"/><text x="43" y="47" fill="#d8c6a6" font-family="monospace" font-size="13">stable-fin / retirement projection</text>
  <g fill="none" stroke="#9f8b6f" stroke-width="1.5"><path d="M165 180H205M345 180H385M525 180H565"/><rect x="35" y="140" width="130" height="80" rx="6"/><rect x="205" y="140" width="140" height="80" rx="6"/><rect x="385" y="140" width="140" height="80" rx="6"/><rect x="565" y="140" width="120" height="80" rx="6"/></g>
  <g font-family="monospace" text-anchor="middle" fill="#fff1d7"><text x="100" y="177" font-size="15">Inputs</text><text x="100" y="198" font-size="11" fill="#d8c6a6">rates / years</text><text x="275" y="177" font-size="15">Grow corpus</text><text x="275" y="198" font-size="11" fill="#d8c6a6">monthly</text><text x="455" y="177" font-size="15">Drawdown</text><text x="455" y="198" font-size="11" fill="#d8c6a6">inflation</text><text x="625" y="177" font-size="15">Result</text><text x="625" y="198" font-size="11" fill="#d8c6a6">verdict</text><text x="360" y="298" font-size="12" fill="#d8c6a6">Inputs → compound → simulate → sustainability</text></g>
</svg>
