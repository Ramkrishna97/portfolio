  <circle class="motion" r="4.5" fill="var(--accent)" opacity="0"><animateMotion path="M360 210L224 260" keyPoints="0;0;1;1" keyTimes="0;0.28;0.45;1" calcMode="linear" dur="12s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.28;0.295;0.435;0.45;1" dur="12s" repeatCount="indefinite"/></circle>
  <circle class="motion" r="4.5" fill="var(--accent)" opacity="0"><animateMotion path="M574 82H450V111H360V146" keyPoints="0;0;1;1" keyTimes="0;0.53;0.7;1" calcMode="linear" dur="12s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.53;0.545;0.685;0.7;1" dur="12s" repeatCount="indefinite"/></circle>
  <circle class="motion" r="4.5" fill="var(--accent)" opacity="0"><animateMotion path="M360 210L496 260H578V210H455V111H574" keyPoints="0;0;1;1" keyTimes="0;0.78;0.95;1" calcMode="linear" dur="12s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.78;0.795;0.935;0.95;1" dur="12s" repeatCount="indefinite"/></circle>
  <path d="M24 362H696" stroke="#827ca8" opacity=".45"/>
  <text class="overview" x="360" y="394" style="text-anchor:middle;fill:var(--muted);font-size:13px">Publish → authorize → attempt → score and solutions</text>
  <text class="motion phase-caption" x="360" y="394" opacity="0" aria-hidden="true">1 / A teacher publishes content or imports a quiz<animate attributeName="opacity" values="1;0;0;0;1" keyTimes="0;.25;.5;.75;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
  <text class="motion phase-caption" x="360" y="394" opacity="0" aria-hidden="true">2 / Role checks protect publishing and ownership<animate attributeName="opacity" values="0;1;0;0;0" keyTimes="0;.25;.5;.75;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
  <text class="motion phase-caption" x="360" y="394" opacity="0" aria-hidden="true">3 / A student opens a timed quiz from the feed<animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;.25;.5;.75;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
  <text class="motion phase-caption" x="360" y="394" opacity="0" aria-hidden="true">4 / Answers are scored and solutions are returned<animate attributeName="opacity" values="0;0;0;1;0" keyTimes="0;.25;.5;.75;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
</svg>
