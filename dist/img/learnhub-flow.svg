  <rect class="motion" x="428" y="260" width="150" height="68" rx="7" fill="none" stroke="var(--accent)" stroke-width="2.5" opacity="0"><animate attributeName="opacity" values="0;0;0;1;0" keyTimes="0;.25;.5;.75;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></rect>
  <text x="503" y="290" class="node-title">Quiz + H2</text><text x="503" y="311" class="node-subtitle">attempt / score / solution</text>
