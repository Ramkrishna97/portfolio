<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">learnhub / publish to quiz result</title>
  <desc id="desc">A teacher publishes learning content through the React interface. Spring Boot checks the teacher role and stores content and quiz questions in H2. A student opens the quiz, submits answers, and receives a score and solutions.</desc>
  <style>
    svg { --node:#3e3b59; --line:#827ca8; --accent:#d8c9ff; --text:#f1ecff; --muted:#c8c0df; background:#29283a; font-family:monospace; }
    text { fill:var(--text); }
    .node-title { text-anchor:middle; font-size:17px; }
    .node-subtitle { text-anchor:middle; font-size:11px; fill:var(--muted); }
    .wire { fill:none; stroke:var(--line); stroke-width:1.5; }
    .motion { visibility:hidden; }
    .motion-ready .motion { visibility:visible; }
    .motion-ready .overview { visibility:hidden; }
    .phase-caption { text-anchor:middle; font-size:16px; fill:var(--accent); }
    @media (prefers-reduced-motion:reduce) { .motion-ready .motion { visibility:hidden !important; } .motion-ready .overview { visibility:visible !important; } }
  </style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#827ca8"/></marker></defs>
  <rect width="720" height="420" fill="#29283a"/>
  <text x="24" y="29" style="fill:var(--muted);font-size:13px">learnhub / publish to quiz result</text>
  <path d="M146 82H270" class="wire" marker-end="url(#arrow)"/>
  <path d="M574 82H450" class="wire" marker-end="url(#arrow)"/>
