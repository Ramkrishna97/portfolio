  <rect class="motion" x="34" y="54" width="112" height="56" rx="7" fill="none" stroke="var(--accent)" stroke-width="2.5" opacity="0"><animate attributeName="opacity" values="1;0;0;0;1" keyTimes="0;.25;.5;.75;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></rect>
  <text x="90" y="78" class="node-title">Teacher</text><text x="90" y="98" class="node-subtitle">publish / import</text>
