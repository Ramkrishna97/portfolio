  <rect class="motion" x="574" y="54" width="112" height="56" rx="7" fill="none" stroke="var(--accent)" stroke-width="2.5" opacity="0"><animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;.25;.5;.75;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></rect>
  <text x="630" y="78" class="node-title">Student</text><text x="630" y="98" class="node-subtitle">attempt quiz</text>
  <rect x="270" y="48" width="180" height="63" rx="7" fill="var(--node)" stroke="var(--line)"/>
  <rect class="motion" x="270" y="48" width="180" height="63" rx="7" fill="none" stroke="var(--accent)" stroke-width="2.5" opacity="0"><animate attributeName="opacity" values="1;0;1;0;1" keyTimes="0;.25;.5;.75;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></rect>
  <text x="360" y="75" class="node-title">React UI</text><text x="360" y="96" class="node-subtitle">feed / publishing / quiz</text>
  <rect x="265" y="146" width="190" height="64" rx="7" fill="var(--node)" stroke="var(--line)"/>
  <rect class="motion" x="265" y="146" width="190" height="64" rx="7" fill="none" stroke="var(--accent)" stroke-width="2.5" opacity="0"><animate attributeName="opacity" values="0;1;0;1;0" keyTimes="0;.25;.5;.75;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></rect>
  <text x="360" y="174" class="node-title">Spring Boot API</text><text x="360" y="195" class="node-subtitle">session + role checks</text>
  <rect x="142" y="260" width="150" height="68" rx="7" fill="var(--node)" stroke="var(--line)"/>
  <rect class="motion" x="142" y="260" width="150" height="68" rx="7" fill="none" stroke="var(--accent)" stroke-width="2.5" opacity="0"><animate attributeName="opacity" values="0;1;0;0;0" keyTimes="0;.25;.5;.75;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></rect>
