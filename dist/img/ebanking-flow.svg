<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">e-banking / authenticated account request</title>
  <desc id="desc">The React dashboard sends a bearer token to Spring Cloud Gateway. The gateway validates the JWT, adds the customer identity, resolves the account service through Eureka, and returns account data from the service-owned H2 database.</desc>
  <style>
    svg { --node:#294748; --line:#649090; --accent:#91e2c8; --text:#e2f6f0; --muted:#b9d6cf; background:#1d3031; font-family:monospace; }
    text { fill:var(--text); }.node-title { text-anchor:middle; font-size:17px; }.node-subtitle { text-anchor:middle; font-size:11px; fill:var(--muted); }.wire { fill:none; stroke:var(--line); stroke-width:1.5; }.motion { visibility:hidden; }.motion-ready .motion { visibility:visible; }.motion-ready .overview { visibility:hidden; }.phase-caption { text-anchor:middle; font-size:16px; fill:var(--accent); }
    @media (prefers-reduced-motion:reduce) { .motion-ready .motion { visibility:hidden !important; } .motion-ready .overview { visibility:visible !important; } }
  </style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#649090"/></marker></defs>
  <rect width="720" height="420" fill="#1d3031"/><text x="24" y="29" style="fill:var(--muted);font-size:13px">e-banking / authenticated account request</text>
  <path d="M360 96V132" class="wire" marker-end="url(#arrow)"/><path d="M260 165H184" class="wire" stroke-dasharray="5 5" marker-end="url(#arrow)"/><path d="M360 198V232M100 232H620M100 232V270M273 232V270M447 232V270M620 232V270" class="wire"/>
  <rect x="272" y="45" width="176" height="51" rx="7" fill="var(--node)" stroke="var(--line)"/><rect class="motion" x="272" y="45" width="176" height="51" rx="7" fill="none" stroke="var(--accent)" stroke-width="2.5" opacity="0"><animate attributeName="opacity" values="1;0;0;1;1" keyTimes="0;.25;.5;.75;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></rect><text x="360" y="67" class="node-title">React dashboard</text><text x="360" y="87" class="node-subtitle">Bearer JWT</text>
  <rect x="260" y="132" width="200" height="66" rx="7" fill="var(--node)" stroke="var(--line)"/><rect class="motion" x="260" y="132" width="200" height="66" rx="7" fill="none" stroke="var(--accent)" stroke-width="2.5" opacity="0"><animate attributeName="opacity" values="1;0;0;1;1" keyTimes="0;.25;.5;.75;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></rect><text x="360" y="160" class="node-title">API Gateway</text><text x="360" y="182" class="node-subtitle">validate + X-Customer-Id</text>
  <rect x="28" y="137" width="156" height="58" rx="7" fill="var(--node)" stroke="var(--line)"/><rect class="motion" x="28" y="137" width="156" height="58" rx="7" fill="none" stroke="var(--accent)" stroke-width="2.5" opacity="0"><animate attributeName="opacity" values="0;1;0;0;0" keyTimes="0;.25;.5;.75;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></rect><text x="106" y="162" class="node-title">Eureka</text><text x="106" y="183" class="node-subtitle">service discovery</text>
  <rect x="28" y="270" width="144" height="68" rx="7" fill="var(--node)" stroke="var(--line)"/><text x="100" y="300" class="node-title">Auth / KYC</text><text x="100" y="321" class="node-subtitle">customers + tokens</text>
  <rect x="201" y="270" width="144" height="68" rx="7" fill="var(--node)" stroke="var(--line)"/><rect class="motion" x="201" y="270" width="144" height="68" rx="7" fill="none" stroke="var(--accent)" stroke-width="2.5" opacity="0"><animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;.25;.5;.75;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></rect><text x="273" y="300" class="node-title">Accounts</text><text x="273" y="321" class="node-subtitle">service-owned H2</text>
  <rect x="375" y="270" width="144" height="68" rx="7" fill="var(--node)" stroke="var(--line)"/><text x="447" y="300" class="node-title">Cards</text><text x="447" y="321" class="node-subtitle">controls + data</text>
  <rect x="548" y="270" width="144" height="68" rx="7" fill="var(--node)" stroke="var(--line)"/><text x="620" y="300" class="node-title">Loans</text><text x="620" y="321" class="node-subtitle">EMI calculations</text>
  <circle class="motion" r="4.5" fill="var(--accent)" opacity="0"><animateMotion path="M360 96V132" keyPoints="0;0;1;1" keyTimes="0;0.03;0.2;1" calcMode="linear" dur="12s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.03;0.045;0.185;0.2;1" dur="12s" repeatCount="indefinite"/></circle>
  <circle class="motion" r="4.5" fill="var(--accent)" opacity="0"><animateMotion path="M260 165H184H260" keyPoints="0;0;1;1" keyTimes="0;0.28;0.45;1" calcMode="linear" dur="12s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.28;0.295;0.435;0.45;1" dur="12s" repeatCount="indefinite"/></circle>
  <circle class="motion" r="4.5" fill="var(--accent)" opacity="0"><animateMotion path="M360 198V232H273V270" keyPoints="0;0;1;1" keyTimes="0;0.53;0.7;1" calcMode="linear" dur="12s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.53;0.545;0.685;0.7;1" dur="12s" repeatCount="indefinite"/></circle>
  <circle class="motion" r="4.5" fill="var(--accent)" opacity="0"><animateMotion path="M273 270V232H360V96" keyPoints="0;0;1;1" keyTimes="0;0.78;0.95;1" calcMode="linear" dur="12s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.78;0.795;0.935;0.95;1" dur="12s" repeatCount="indefinite"/></circle>
  <path d="M24 362H696" stroke="#649090" opacity=".45"/><text class="overview" x="360" y="394" style="text-anchor:middle;fill:var(--muted);font-size:13px">JWT → gateway → discovery → account data</text>
  <text class="motion phase-caption" x="360" y="394" opacity="0" aria-hidden="true">1 / The dashboard sends an authenticated request<animate attributeName="opacity" values="1;0;0;0;1" keyTimes="0;.25;.5;.75;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
  <text class="motion phase-caption" x="360" y="394" opacity="0" aria-hidden="true">2 / Eureka resolves the registered account service<animate attributeName="opacity" values="0;1;0;0;0" keyTimes="0;.25;.5;.75;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
  <text class="motion phase-caption" x="360" y="394" opacity="0" aria-hidden="true">3 / The gateway forwards the verified customer ID<animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;.25;.5;.75;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
  <text class="motion phase-caption" x="360" y="394" opacity="0" aria-hidden="true">4 / Account data returns through the gateway<animate attributeName="opacity" values="0;0;0;1;0" keyTimes="0;.25;.5;.75;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
</svg>
